name: Package release

on:
  workflow_call:
    inputs:
      base_dir:
        description: "Optional base directory to run commands in"
        required: false
        type: string
        default: "."
      run_build:
        description: "Install dependencies and run `npm run build` before publishing (needed for packages that ship a built artifact, e.g. a dual CJS/ESM package)"
        required: false
        type: boolean
        default: false
    outputs:
      tag_name:
        description: "Created version tag"
        value: ${{ jobs.version.outputs.tag_name }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.capture_tag.outputs.tag_name }}

    steps:
      - name: Checkout code (${{ github.ref }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branch and tags
        run: |
          git fetch --all --tags --prune
          git checkout main
          git reset --hard origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ format('{0}/.nvmrc', inputs.BASE_DIR) }}
          registry-url: https://npm.pkg.github.com
          scope: '@dignityfalconer'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/package_release_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/package_release_config/release.config.cjs ./release.config.cjs

      - name: Configure git auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prime npm authentication
        run: npm config list
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare .npmrc
        run: |
          rm -f .npmrc
          echo "@dignityfalconer:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install package dependencies
        if: inputs.run_build == true
        working-directory: ${{ inputs.base_dir }}
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        if: inputs.run_build == true
        working-directory: ${{ inputs.base_dir }}
        run: npm run build

      - name: Run semantic-release
        id: sr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config/package_release_config/node_modules/.bin/semantic-release --no-ci
