name: Package release

on:
  workflow_call:
    inputs:
      base_dir:
        description: "Optional base directory to run commands in"
        required: false
        type: string
        default: "."
    outputs:
      tag_name:
        description: "Created version tag"
        value: ${{ jobs.version.outputs.tag_name }}

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.capture_tag.outputs.tag_name }}

    steps:
      - name: Checkout code (${{ github.ref }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ format('{0}/.nvmrc', inputs.BASE_DIR) }}
          registry-url: https://npm.pkg.github.com
          scope: '@dignityfalconer'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/package_release_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/package_release_config/release.config.cjs ./release.config.cjs

      - name: Configure git auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run semantic-release
        id: sr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config/package_release_config/node_modules/.bin/semantic-release --no-ci

      - name: Capture created tag
        id: capture_tag
        run: |
          echo "Looking for tag pointing to commit $GITHUB_SHA"

          # Fetch tags
          git fetch --tags --force

          TAG=$(git tag --points-at $GITHUB_SHA | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No tag found pointing to this commit."
            exit 1
          fi

          echo "Tag created: $TAG"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
      
