name: Deploy

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "The target environment for deployment"
        required: true
        type: string
      TAG:
        description: "Tag to checkout"
        required: true
        type: string
      DEPLOYMENT_CONFIG_FILENAME:
        description: "The config yaml filename for deployment"
        required: true
        type: string
      GCP_SERVICE_NAME:
        description: "The name of this service as it appears in GCP"
        required: false
        default: ""
        type: string
      AUTO_PROMOTE:
        description: "If this should be auto promoted to accept traffic"
        required: false
        type: boolean
      STOP_FAILED_VERSION:
        description: "If false, skip gcloud app versions stop when health fails (e.g. App Engine Standard autoscaling)"
        required: false
        type: boolean
        default: true
    secrets:
      PROJECT:
        description: "The target project for deployment"
        required: true
      WORKLOAD_IDENTITY_PROVIDER:
        description: "The workload identity provider specific for the environment"
        required: true
      SERVICE_ACCOUNT:
        description: "The service account specific for the environment"
        required: true

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}

    steps:
      - name: Validate tag
        id: validate_tag
        run: |
          TAG="${{ inputs.TAG }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid tag '$TAG'. Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout code (${{ steps.validate_tag.outputs.tag }})
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.validate_tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Debug GitHub OIDC token
        run: |
          curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq .

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.PROJECT }}'

      - name: Prepare .npmrc
        run: |
          rm -f .npmrc
          echo "@dignityfalconer:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Create version file
        run: |
          VERSION="${{ steps.validate_tag.outputs.tag }}-${{ inputs.ENVIRONMENT }}"
          node version --version=$VERSION

      - name: Convert tag to GCP tag
        id: convert_tag
        run: |
          TAG="${{ steps.validate_tag.outputs.tag }}"
          GCP_TAG="${TAG//./-}"
          echo "Converted GCP_TAG: $GCP_TAG"
          echo "gcp_tag=$GCP_TAG" >> $GITHUB_OUTPUT

      - name: Deploying to ${{ inputs.ENVIRONMENT }} (${{ steps.convert_tag.outputs.gcp_tag }})
        run: |
          gcloud app deploy \
            --no-promote \
            --quiet \
            --project "${{ secrets.PROJECT }}" \
            --version ${{ steps.convert_tag.outputs.gcp_tag }} \
            ${{ inputs.DEPLOYMENT_CONFIG_FILENAME }}

      - name: Validate health version
        id: health_check
        if: ${{ inputs.GCP_SERVICE_NAME }}
        continue-on-error: true
        run: |
          EXPECTED_VERSION="${{ steps.validate_tag.outputs.tag }}-${{ inputs.ENVIRONMENT }}"
          URL="https://${{ steps.convert_tag.outputs.gcp_tag }}-dot-${{ inputs.GCP_SERVICE_NAME }}-dot-${{ secrets.PROJECT }}.nw.r.appspot.com/health"

          echo "Checking $URL"
          echo "Expected version: $EXPECTED_VERSION"

          for i in {1..10}; do
            RESPONSE=$(curl -s --max-time 3 $URL || true)
            echo "Raw response: $RESPONSE"
            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
            DEPLOYED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')

            echo "Attempt $i - status: $STATUS, version: $DEPLOYED_VERSION"

            if [[ "$STATUS" == "ok" && "$DEPLOYED_VERSION" == "$EXPECTED_VERSION" ]]; then
              echo "Health validation passed"
              exit 0
            fi

            sleep 3
          done

          echo "::error ::Health validation failed"
          exit 1

      - name: Promote traffic to new version
        if: ${{ inputs.AUTO_PROMOTE && steps.health_check.outcome == 'success' }}
        run: |
          echo "Promoting traffic to version ${{ steps.convert_tag.outputs.gcp_tag }}"

          # Promote traffic entirely to the new version
          gcloud app services set-traffic ${{ inputs.GCP_SERVICE_NAME }} \
            --splits ${{ steps.convert_tag.outputs.gcp_tag }}=1 \
            --project "${{ secrets.PROJECT }}" \
            --quiet

      - name: Stop deployed version on health failure
        if: ${{ inputs.GCP_SERVICE_NAME != '' && inputs.STOP_FAILED_VERSION && steps.health_check.outcome != 'success' }}
        run: |
          echo "Health check failed, stopping version ${{ steps.convert_tag.outputs.gcp_tag }}"
          gcloud app versions stop ${{ steps.convert_tag.outputs.gcp_tag }} \
            --service=${{ inputs.GCP_SERVICE_NAME }} \
            --project "${{ secrets.PROJECT }}" \
            --quiet

          # Fail the workflow explicitly
          echo "Deployment failed because /health did not pass - version has been stopped"
          exit 1
          
      - name: Fail if health check did not pass
        if: ${{ steps.health_check.outcome == 'failure' }}
        run: |
          echo "::error ::Deployment failed because /health did not pass"
          exit 1