name: Deploy

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "The target environment for deployment"
        required: true
        type: string
      TAG:
        description: "Tag to checkout"
        required: true
        type: string
      DEPLOYMENT_CLOUDBUILD_FILENAME:
        description: "The cloudbuild yaml filename for deployment"
        required: true
        type: string
      DEPLOYMENT_CONFIG_FILENAME:
        description: "The config yaml filename for deployment"
        required: true
        type: string
      BASE_DIR:
        description: "Optional base directory to run commands in"
        required: false
        type: string
        default: "."
      SECRETS_CONFIG_NAME:
        description: "The name of the stored config file in GCP secrets manager"
        required: false
        type: string
      LOCAL_CONFIG_FULL_PATH:
        description: "The full path locally to store the config file from GCP secrets manager"
        required: false
        type: string
      SECRETS_SA_KEY_NAME:
        description: "The name of the stored Service Account key in GCP secrets manager"
        required: false
        type: string
      LOCAL_SA_KEY_FULL_PATH:
        description: "The full path locally to store the Service Account key file from GCP secrets manager"
        required: false
        type: string
      GCP_SERVICE_NAME:
        description: "The name of this service as it appears in GCP"
        required: false
        default: ""
        type: string
      AUTO_PROMOTE:
        description: "If this should be auto promoted to accept traffic"
        required: false
        default: false
        type: boolean
      STOP_FAILED_VERSION:
        description: "If true, stop the deployed version when /health fails. Use false when stop is unsafe (e.g. App Engine Standard UAT); Flex often uses true."
        required: false
        type: boolean
        default: false
    secrets:
      PROJECT:
        description: "The target project for deployment - needed for both Cloud Run and App Engine services"
        required: true
      PROJECT_NUMBER:
        description: "The target project number for deployment - needed for Cloud Run services"
        required: false
      WORKLOAD_IDENTITY_PROVIDER:
        description: "The workload identity provider specific for the environment"
        required: true
      SERVICE_ACCOUNT:
        description: "The service account specific for the environment"
        required: true

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}

    steps:
      - name: Validate tag
        id: validate_tag
        run: |
          TAG="${{ inputs.TAG }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid tag '$TAG'. Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout code (${{ steps.validate_tag.outputs.tag }})
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.validate_tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ format('{0}/.nvmrc', inputs.BASE_DIR) }}

      - name: Confirm node version
        run: node -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Debug GitHub OIDC token
        run: |
          curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq .

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: '${{ secrets.GCP_PROJECT }}'

      - name: Download config file
        if: ${{ inputs.SECRETS_CONFIG_NAME && inputs.LOCAL_CONFIG_FULL_PATH }}
        run: |
          CONFIG_PATH="${{ inputs.LOCAL_CONFIG_FULL_PATH }}"
          CONFIG_DIR=$(dirname "$CONFIG_PATH")

          echo "directory = $CONFIG_DIR"
          echo "full path = $CONFIG_PATH"
          
          mkdir -p "$CONFIG_DIR"

          gcloud secrets versions access latest \
            --secret="${{ inputs.SECRETS_CONFIG_NAME }}" \
            > "$CONFIG_PATH"

      - name: Download key file
        if: ${{ inputs.SECRETS_SA_KEY_NAME && inputs.LOCAL_SA_KEY_FULL_PATH }}
        run: |
          KEY_PATH="${{ inputs.LOCAL_SA_KEY_FULL_PATH }}"
          KEY_DIR=$(dirname "$KEY_PATH")

          echo "directory = $KEY_DIR"
          echo "full path = $KEY_PATH"
          
          mkdir -p "$KEY_DIR"

          gcloud secrets versions access latest \
            --secret="${{ inputs.SECRETS_SA_KEY_NAME }}" \
            > "$KEY_PATH"

      - name: Prepare .npmrc
        working-directory: ${{ inputs.BASE_DIR }}
        run: |
          rm -f .npmrc
          echo "@dignityfalconer:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Create version file
        working-directory: ${{ inputs.BASE_DIR }}
        run: |
          VERSION="${{ steps.validate_tag.outputs.tag }}-${{ inputs.ENVIRONMENT }}"
          node version --version=$VERSION

      - name: Convert tag to GCP tag
        id: convert_tag
        run: |
          TAG="${{ steps.validate_tag.outputs.tag }}"
          GCP_TAG="${TAG//./-}"
          echo "Converted GCP_TAG: $GCP_TAG"
          echo "gcp_tag=$GCP_TAG" >> $GITHUB_OUTPUT

      - name: Deploying to ${{ inputs.ENVIRONMENT }} (${{ steps.convert_tag.outputs.gcp_tag }})
        run: |
          if [ -n "${{ inputs.GCP_SERVICE_NAME }}" ]; then
            SERVICE_NAME="${{ inputs.GCP_SERVICE_NAME }}"
          else
            SERVICE_NAME="${GITHUB_REPOSITORY##*/}"
          fi
      
          gcloud builds submit \
            --project "${{ secrets.PROJECT }}" \
            --config ${{ inputs.DEPLOYMENT_CLOUDBUILD_FILENAME }} \
            --substitutions=_REPO_NAME=${REPO_NAME},_SERVICE_NAME=${SERVICE_NAME},_VERSION=${{ steps.convert_tag.outputs.gcp_tag }},_APP_YAML=${{ inputs.DEPLOYMENT_CONFIG_FILENAME }} \
            --region=europe-west2 \
            ${{ inputs.BASE_DIR }}

      - name: Validate health version
        id: health_check
        if: ${{ inputs.GCP_SERVICE_NAME }}
        continue-on-error: true
        run: |
          TAG="${{ steps.convert_tag.outputs.gcp_tag }}"
          EXPECTED_VERSION="${{ steps.validate_tag.outputs.tag }}-${{ inputs.ENVIRONMENT }}"

          if [[ -n "${{ secrets.PROJECT_NUMBER }}" ]]; then
            URL="https://${TAG}---${{ inputs.GCP_SERVICE_NAME }}-${{ secrets.PROJECT_NUMBER }}.europe-west2.run.app/health"
          else
            URL="https://${TAG}-dot-${{ inputs.GCP_SERVICE_NAME }}-dot-${{ secrets.PROJECT }}.nw.r.appspot.com/health"
          fi
    
          echo "Checking $URL"
          echo "Expected version: $EXPECTED_VERSION"

          for i in {1..10}; do
            RESPONSE=$(curl -s --max-time 3 $URL || true)
            echo "Raw response: $RESPONSE"
            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
            DEPLOYED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')

            echo "Attempt $i - status: $STATUS, version: $DEPLOYED_VERSION"

            if [[ "$STATUS" == "ok" && "$DEPLOYED_VERSION" == "$EXPECTED_VERSION" ]]; then
              echo "Health validation passed"
              exit 0
            fi

            sleep 3
          done

          echo "::error ::Health validation failed"
          exit 1

      - name: Promote traffic to new version
        if: ${{ inputs.AUTO_PROMOTE == true && steps.health_check.outcome == 'success' }}
        run: |
          TAG="${{ steps.convert_tag.outputs.gcp_tag }}"
          echo "Promoting traffic to version ${TAG}"

          if [[ -n "${{ secrets.PROJECT_NUMBER }}" ]]; then
            gcloud run services update-traffic ${{ inputs.GCP_SERVICE_NAME }} \
            --to-tags ${TAG}=100 \
            --region europe-west2 \
            --project "${{ secrets.PROJECT }}" \
            --quiet
          else
            gcloud app services set-traffic ${{ inputs.GCP_SERVICE_NAME }} \
            --splits ${TAG}=1 \
            --project "${{ secrets.PROJECT }}" \
            --quiet
          fi

      - name: Stop deployed version on health failure
        if: ${{ inputs.GCP_SERVICE_NAME != '' && inputs.STOP_FAILED_VERSION == true && steps.health_check.outcome != 'success' }}
        run: |
          echo "Health check failed, stopping version ${{ steps.convert_tag.outputs.gcp_tag }}"
          gcloud app versions stop ${{ steps.convert_tag.outputs.gcp_tag }} \
            --service=${{ inputs.GCP_SERVICE_NAME }} \
            --project "${{ secrets.PROJECT }}" \
            --quiet

          # Fail the workflow explicitly
          echo "Deployment failed because /health did not pass - version has been stopped"
          exit 1

      - name: Fail if health check did not pass
        if: ${{ steps.health_check.outcome == 'failure' }}
        run: |
          echo "::error ::Deployment failed because /health did not pass"
          exit 1
