name: Build

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "The target environment for deployment"
        required: true
        type: string
      TAG:
        description: "Tag to checkout"
        required: true
        type: string
      DEPLOYMENT_CLOUDBUILD_FILENAME:
        description: "The cloudbuild yaml filename for deployment"
        required: true
        type: string
      DEPLOYMENT_CONFIG_FILENAME:
        description: "The config yaml filename for deployment"
        required: true
        type: string
      BASE_DIR:
        description: "Optional base directory to run commands in"
        required: false
        type: string
        default: "."
      SECRETS_CONFIG_NAME:
        description: "The name of the stored config file in GCP secrets manager"
        required: false
        type: string
      LOCAL_CONFIG_FULL_PATH:
        description: "The full path locally to store the config file from GCP secrets manager"
        required: false
        type: string
      SECRETS_SA_KEY_NAME:
        description: "The name of the stored Service Account key in GCP secrets manager"
        required: false
        type: string
      LOCAL_SA_KEY_FULL_PATH:
        description: "The full path locally to store the Service Account key file from GCP secrets manager"
        required: false
        type: string
    secrets:
      PROJECT:
        description: "The target project for deployment"
        required: true
      WORKLOAD_IDENTITY_PROVIDER:
        description: "The workload identity provider specific for the environment"
        required: true
      SERVICE_ACCOUNT:
        description: "The service account specific for the environment"
        required: true

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  deploy:
    runs-on: web-ui-large
    environment: ${{ inputs.ENVIRONMENT }}

    steps:
      - name: Validate tag
        id: validate_tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error ::Tag is required (passed from version workflow)"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error ::Invalid tag '$TAG'. Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.validate_tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEV_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.DEV_GCP_PROJECT }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz

      - name: Download environment file
        run: |
          mkdir -p src/environments
          gcloud secrets versions access latest \
            --secret="${{ env.GCP_ENV_SECRET_NAME }}" \
            > src/environments/environment.ts
          gcloud secrets versions access latest \
            --secret="${{ env.GCP_ENV_SECRET_NAME }}" \
            > src/environments/environment.dignity-dev.ts

      - name: Download service account key (DEV)
        run: |
          mkdir -p server/service-keys/uk
          gcloud secrets versions access latest \
            --secret="${{ env.GCP_SA_KEY_SECRET }}" \
            --project="${{ env.DEV_GCP_PROJECT }}" \
            > server/service-keys/uk/prod-dignity-dev.json

      - name: Create version file
        run: |
          cat <<EOF > src/environments/.env.ts
          export class env {
            static project_version = "${{ steps.validate_tag.outputs.tag }}-dev"
          }
          EOF

      - name: Prepare .npmrc
        run: |
          rm -f .npmrc
          echo "@dignityfalconer:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOMETOKEN }}" >> .npmrc

      - name: Apply environment variables
        run: |
          if [[ -n "${{ secrets.FONTAWESOMETOKEN }}" ]]; then
            echo "FONTAWESOME_TOKEN=${{ secrets.FONTAWESOMETOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert tag to App Engine version
        id: convert_tag
        run: |
          TAG="${{ steps.validate_tag.outputs.tag }}"
          GCP_TAG="${TAG//./-}"
          echo "gcp_tag=$GCP_TAG" >> $GITHUB_OUTPUT

      - name: Build app
        run: |
          export NG_BUILD_MAX_WORKERS=1
          node --max_old_space_size=8192 ./node_modules/.bin/ng build \
            --configuration=dignity-dev \
            --source-map=false

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Deploy to DEV
        working-directory: server
        run: |
          gcloud app deploy app_dignity_dev.yaml \
            --no-promote \
            --quiet \
            --project "${{ env.DEV_GCP_PROJECT }}" \
            --version ${{ steps.convert_tag.outputs.gcp_tag }}
