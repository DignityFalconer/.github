name: Tests (pnpm)

on:
  workflow_call:
    inputs:
      BASE_DIR:
        description: "Optional base directory to run commands in"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ format('{0}/.nvmrc', inputs.BASE_DIR) }}

      - name: Confirm node version
        run: node -v
        working-directory: ${{ inputs.BASE_DIR }}

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: ${{ inputs.BASE_DIR }}

      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz
        working-directory: ${{ inputs.BASE_DIR }}

      - name: Run lint
        run: pnpm run lint
        working-directory: ${{ inputs.BASE_DIR }}
        continue-on-error: true # TODO: Remove

#    - name: Run formatting
#      run: pnpm run format
#      working-directory: ${{ inputs.BASE_DIR }}
#
      - name: Run unit tests
        run: pnpm run test
        working-directory: ${{ inputs.BASE_DIR }}
