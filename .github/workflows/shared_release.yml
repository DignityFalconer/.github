name: Release

on:
  workflow_call:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Checkout shared release config 
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: shared

      - name: Install release dependencies
        working-directory: shared/release
        run: npm ci

      - name: Run semantic-release
        working-directory: shared/release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
