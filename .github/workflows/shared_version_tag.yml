name: Version Tag

on:
  workflow_call:
    outputs:
      tag_name:
        description: "Created version tag"
        value: ${{ jobs.version.outputs.tag_name }}

permissions:
  contents: write
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.capture_tag.outputs.tag_name }}

    steps:
      - name: Checkout code (${{ github.ref }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/version_tag_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/version_tag_config/release.config.cjs ./release.config.cjs

      - name: Run semantic-release
        id: sr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config/version_tag_config/node_modules/.bin/semantic-release --no-ci

      - name: Capture created tag
        id: capture_tag
        run: |
          echo "Looking for tag pointing to commit $GITHUB_SHA"

          # Fetch tags
          git fetch --tags --force

          TAG=$(git tag --points-at $GITHUB_SHA | head -n 1)

          if [ -z "$TAG" ]; then
            echo "No tag found pointing to this commit."
            exit 1
          fi

          echo "Tag created: $TAG"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
      
