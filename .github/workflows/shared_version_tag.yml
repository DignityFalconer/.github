name: Version Tag

on:
  workflow_call:
    secrets:
      TOKEN:
        required: true

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (${{ github.ref }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/version_tag_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/version_tag_config/release.config.cjs ./release.config.cjs

      - name: Run semantic-release
        id: sr
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          config/version_tag_config/node_modules/.bin/semantic-release --no-ci

      - name: Capture created tag safely
        id: capture_tag
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "Finding release created for commit $GITHUB_SHA"

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases)

          TAG=$(echo "$RESPONSE" | jq -r \
            --arg SHA "$GITHUB_SHA" \
            '.[] | select(.target_commitish == $SHA) | .tag_name' \
            | head -n 1)

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No release found for this commit."
            exit 1
          fi

          echo "Tag created: $TAG"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
