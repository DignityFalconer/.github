name: Version Tag

on:
  workflow_call:
    secrets:
      TOKEN:
        required: true

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/version_tag_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/version_tag_config/release.config.cjs ./release.config.cjs

      # 🔥 SAFE semantic-release execution with tag capture
      - name: Run semantic-release (safe + capture tag)
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          node <<'EOF'
          const semanticRelease = require('./config/version_tag_config/node_modules/semantic-release');

          (async () => {
            const result = await semanticRelease({
              ci: false
            });

            if (!result || !result.nextRelease) {
              console.log("No release created.");
              process.exit(0);
            }

            const tag = result.nextRelease.gitTag;
            console.log("Created tag:", tag);

            require('fs').appendFileSync(
              process.env.GITHUB_OUTPUT,
              `tag_name=${tag}\n`
            );
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
