name: Version Tag

on:
  workflow_call:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm node version
        run: node -v

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: dignityfalconer/.github
          path: config

      - name: Install version tag dependencies
        working-directory: config/version_tag_config
        run: npm ci

      - name: Copy config file into project
        run: cp config/version_tag_config/release.config.cjs project-code/release.config.cjs

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | 
          config/version_tag_config/node_modules/.bin/semantic-release \
          --no-ci \
          --config config/version_tag_config/release.config.cjs
