name: "Install"
description: "Checkout, set up Node, cache node_modules, and run npm ci (GitHub Packages)."

inputs:
  BASE_DIR:
    description: "Optional base directory to run commands in"
    required: false
    default: "."
  TAG:
    description: "Optional tag to checkout"
    required: false
  FONTAWESOME_TOKEN:
    description: "Optional token for FontAwesome"
    required: false

runs:
  using: "composite"
  steps:
    - name: Code ref
      shell: bash
      run: |
        echo "Code to checkout: ${{ inputs.TAG || github.ref }}"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.TAG || github.ref }}

    - name: Apply environment variables
      shell: bash
      run: |
        if [[ -n "${{ inputs.FONTAWESOME_TOKEN }}" ]]; then
          echo "FONTAWESOME_TOKEN=${{ inputs.FONTAWESOME_TOKEN }}" >> "$GITHUB_ENV"
        fi

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.BASE_DIR }}/.nvmrc
        registry-url: https://npm.pkg.github.com
        scope: "@dignityfalconer"
        cache: "npm"
        cache-dependency-path: ${{ inputs.BASE_DIR }}/package-lock.json

    - name: Confirm node version
      shell: bash
      run: node -v
      working-directory: ${{ inputs.BASE_DIR }}

    # Cache node_modules for faster restores
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: ${{ inputs.BASE_DIR }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', inputs.BASE_DIR)) }}
        restore-keys: |
          ${{ runner.os }}-node-

    # Only run npm ci if cache missed
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --legacy-peer-deps
      working-directory: ${{ inputs.BASE_DIR }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
