name: "Install"
inputs:
  BASE_DIR:
    description: "Optional base directory to run commands in"
    required: false
    default: "."
  FONTAWESOME_TOKEN:
    description: "Optional token for FontAwesome"
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Apply environment variables
      shell: bash
      run: |
        if [[ -n "${{ inputs.FONTAWESOME_TOKEN }}" ]]; then
          echo "FONTAWESOME_TOKEN=${{ inputs.FONTAWESOME_TOKEN }}" >> "$GITHUB_ENV"
        fi

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.BASE_DIR }}/.nvmrc
        registry-url: https://npm.pkg.github.com
        scope: '@dignityfalconer'

    - name: Confirm node version
      shell: bash
      run: node -v
      working-directory: ${{ inputs.BASE_DIR }}

    - name: Cache npm registry
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package-lock.json', inputs.BASE_DIR)) }}

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: ${{ inputs.BASE_DIR }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', inputs.BASE_DIR)) }}

    - name: Install dependencies
      shell: bash
      run: npm ci --legacy-peer-deps
      working-directory: ${{ inputs.BASE_DIR }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
