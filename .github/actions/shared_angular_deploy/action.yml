name: "Deploy"
description: "Deploy the Angular app"
inputs:
  GCP_SA_KEY_NAME:
    description: "The name of the stored Service Account key in GCP"
    required: false
  SA_KEY_FULL_PATH:
    description: "The full path locally to store the Service Account key file from GCP"
    required: false
  DEPLOYMENT_CONFIG_FULL_PATH:
    description: "The full path locally of the config yaml for deployment"
    required: true
  PROJECT:
    description: "The target project in GCP"
    required: true
  TAG:
    description: "Tagged version"
    required: true
  ENVIRONMENT:
    description: "The target environment for deployment"
    required: true
  GCP_SERVICE_NAME:
    description: "The name of this service as it appears in GCP"
    required: false
    default: ""
  AUTO_PROMOTE:
    description: "If this should be auto promoted to accept traffic"
    required: false
    default: "false"
  STOP_FAILED_VERSION:
    description: "If true, stop the deployed version when /health fails. Use false when stop is unsafe (e.g. App Engine Standard UAT); Flex often uses true."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Create version file
      shell: bash
      working-directory: server
      run: |
        VERSION="${{ inputs.TAG }}-${{ inputs.ENVIRONMENT }}"
        node version --version=$VERSION

    - name: Convert tag to GCP tag
      id: convert_tag
      shell: bash
      run: |
        TAG="${{ inputs.TAG }}"
        GCP_TAG="${TAG//./-}"
        echo "gcp_tag=$GCP_TAG" >> $GITHUB_OUTPUT

    - name: Download service account key
      shell: bash
      if: ${{ inputs.GCP_SA_KEY_NAME && inputs.SA_KEY_FULL_PATH }}
      run: |
        KEY_PATH="${{ inputs.SA_KEY_FULL_PATH }}"
        KEY_DIR=$(dirname "$KEY_PATH")
        
        mkdir -p "$KEY_DIR"
        
        gcloud secrets versions access latest \
        --secret="${{ inputs.GCP_SA_KEY_NAME }}" \
        --project="${{ inputs.PROJECT }}" \
        > "$KEY_PATH"

    - name: Install server dependencies
      shell: bash
      working-directory: server
      run: npm ci

    - name: Deploy to ${{ inputs.ENVIRONMENT }} (${{ steps.convert_tag.outputs.gcp_tag }})
      shell: bash
      working-directory: server
      run: |
        gcloud app deploy \
          --no-promote \
          --quiet \
          --project "${{ inputs.PROJECT }}" \
          --version ${{ steps.convert_tag.outputs.gcp_tag }} \
          ${{ inputs.DEPLOYMENT_CONFIG_FULL_PATH }}

    - name: Validate health version
      shell: bash
      id: health_check
      if: ${{ inputs.GCP_SERVICE_NAME }}
      continue-on-error: true
      run: |
        EXPECTED_VERSION="${{ inputs.TAG }}-${{ inputs.ENVIRONMENT }}"
        URL="https://${{ steps.convert_tag.outputs.gcp_tag }}-dot-${{ inputs.GCP_SERVICE_NAME }}-dot-${{ inputs.PROJECT }}.nw.r.appspot.com/health"

        echo "Checking $URL"
        echo "Expected version: $EXPECTED_VERSION"

        for i in {1..10}; do
          RESPONSE=$(curl -s --max-time 3 $URL || true)
          echo "Raw response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          DEPLOYED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')

          echo "Attempt $i - status: $STATUS, version: $DEPLOYED_VERSION"

          if [[ "$STATUS" == "ok" && "$DEPLOYED_VERSION" == "$EXPECTED_VERSION" ]]; then
            echo "Health validation passed"
            exit 0
          fi

          sleep 3
        done

        echo "::error ::Health validation failed"
        exit 1

    - name: Promote traffic to new version
      shell: bash
      if: ${{ inputs.AUTO_PROMOTE == 'true' && steps.health_check.outcome == 'success' }}
      run: |
        echo "Promoting traffic to version ${{ steps.convert_tag.outputs.gcp_tag }}"

        # Promote traffic entirely to the new version
        gcloud app services set-traffic ${{ inputs.GCP_SERVICE_NAME }} \
          --splits ${{ steps.convert_tag.outputs.gcp_tag }}=1 \
          --project "${{ inputs.PROJECT }}" \
          --quiet

    - name: Stop deployed version on health failure
      shell: bash
      if: ${{ inputs.GCP_SERVICE_NAME != '' && inputs.STOP_FAILED_VERSION == 'true' && steps.health_check.outcome != 'success' }}
      run: |
        echo "Health check failed, stopping version ${{ steps.convert_tag.outputs.gcp_tag }}"
        gcloud app versions stop ${{ steps.convert_tag.outputs.gcp_tag }} \
          --service=${{ inputs.GCP_SERVICE_NAME }} \
          --project "${{ inputs.PROJECT }}" \
          --quiet

        # Fail the workflow explicitly
        echo "Deployment failed because /health did not pass - version has been stopped"
        exit 1

    - name: Fail if health check did not pass
      shell: bash
      if: ${{ steps.health_check.outcome == 'failure' }}
      run: |
        echo "::error ::Deployment failed because /health did not pass"
        exit 1
