name: "Build"
inputs:
  GCP_ENV_SECRET_NAME:
    description: "Filename of the environments config stored on GCP"
    required: true
  ENV_FILENAME:
    description: "Local filename of the environments config"
    required: true
  ANGULAR_CONFIG_NAME:
    description: "The name of the environment project config in angular.json"
    required: true
  TAG:
    description: "Tagged version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Download environment file
      shell: bash
      run: |
        mkdir -p src/environments
        gcloud secrets versions access latest \
          --secret="${{ inputs.GCP_ENV_SECRET_NAME }}" \
          > src/environments/environment.ts
        gcloud secrets versions access latest \
          --secret="${{ inputs.GCP_ENV_SECRET_NAME }}" \
          > src/environments/${{ inputs.ENV_FILENAME }}

    - name: Create version file
      shell: bash
      run: |
        cat <<EOF > src/environments/.env.ts
        export class env {
          static project_version = "${{ inputs.TAG }}-dev"
        }
        EOF

    - name: Build app
      shell: bash
      run: |
        export NG_BUILD_MAX_WORKERS=1
        node --max_old_space_size=8192 ./node_modules/.bin/ng build \
          --configuration=${{ inputs.ANGULAR_CONFIG_NAME }} \
          --source-map=false
